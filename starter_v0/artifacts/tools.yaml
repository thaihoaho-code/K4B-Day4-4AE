# starter_v0 — intentionally incomplete first-draft declarations.
# Students improve routing guidance, argument conventions, missing-information
# handling, and confirmation boundaries through v1/v2/v3.
#
# Keep built-in names and supplied evaluation cases unchanged.
# Improve descriptions and compatible schemas. Declare team-built bonus tools
# here and in tools/__init__.py, then test them with team-authored cases.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: >
      Gửi câu hỏi cho người dùng và chờ trả lời trước khi tiếp tục.
      BẮT BUỘC gọi tool này trong các trường hợp:
      (1) Trước bất kỳ hành động ghi dữ liệu nào (create_ticket) — dùng response_type="yes_no";
      (2) Thiếu mã tài sản hợp lệ (dạng LT-xxx, DT-xxx) khi kiểm tra thiết bị;
      (3) Thiếu mã nhân viên (dạng EMP-xxx) khi tra cứu nhân viên;
      (4) Môi trường không rõ hoặc không thuộc [production, staging] — dùng response_type="choice".
      TUYỆT ĐỐI KHÔNG tự suy đoán mã hoặc bỏ qua bước xác nhận.
    parameters:
      type: object
      properties:
        question:
          type: string
          default: ""
          description: "Câu hỏi gửi cho người dùng"
        response_type:
          type: string
          enum: [text, yes_no, choice]
          default: "text"
          description: "Dùng 'yes_no' trước write action; 'text' khi thiếu mã máy/nhân viên; 'choice' khi môi trường không rõ."
        options:
          type: array
          default: []
          items: {type: string}
          description: "Danh sách lựa chọn khi response_type='choice', ví dụ: ['production', 'staging']"
      required: [question]

  - name: search_kb
    description: "Tìm hướng dẫn hoặc các bước xử lý trong knowledge base. Dùng khi người dùng yêu cầu tìm tài liệu, hướng dẫn cấu hình hoặc khắc phục lỗi. Luôn truyền query và category phù hợp với chủ đề: VPN -> vpn; Wi-Fi -> wifi; máy in -> printing. Chỉ dùng category=all khi không xác định được nhóm hoặc yêu cầu bao phủ nhiều nhóm."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: " Nhóm nội dung cần tìm. Phải truyền rõ nhóm khi yêu cầu đã xác định chủ đề. Không bỏ qua category chỉ vì query đã chứa tên chủ đề."}
        category: {type: string, enum: [all, vpn, email, wifi, printing, account, security, hardware, software, meeting_room], default: "all", description: "Nhóm hướng dẫn"}
        top_k: {type: integer, default: 3, description: "Số kết quả"}
      required: [query]

  - name: check_service_status
    description: "Kiểm tra trạng thái dịch vụ dùng chung. Chỉ hỗ trợ 2 môi trường: 'production' và 'staging'. Nếu người dùng yêu cầu môi trường không rõ (như 'demo', 'test'), KHÔNG ĐƯỢC tự đoán sang staging mà PHẢI gọi 'clarify' với options ['production', 'staging']."
    parameters:
      type: object
      properties:
        service: {type: string, enum: [vpn, email, sso, wifi, printing]}
        environment: {type: string, enum: [production, staging], default: "production"}
      required: [service]

  - name: inspect_device
    description: "Kiểm tra chẩn đoán thiết bị cụ thể. BẮT BUỘC phải có mã tài sản hợp lệ (dạng LT-xxx, DT-xxx, MB-xxx, PR-xxx). Nếu người dùng chỉ nói chung chung 'laptop của mình' hoặc 'máy tính', KHÔNG ĐƯỢC gọi tool này mà PHẢI gọi 'clarify'. Kiểm tra thông tin và chẩn đoán một thiết bị bằng mã tài sản asset_id. Không dùng để tra cứu tài khoản nhân viên hoặc chỉ liệt kê thiết bị được cấp; các yêu cầu đó dùng lookup_user. Luôn truyền check theo vấn đề người dùng yêu cầu.  Chỉ dùng check=all khi người dùng yêu cầu kiểm tra tổng thể hoặc không nêu nhóm vấn đề cụ thể. Nếu yêu cầu có cả trạng thái dịch vụ dùng chung và kiểm tra thiết bị, gọi cả check_service_status và inspect_device."
    parameters:
      type: object
      properties:
        asset_id: {type: string, description: "Mã tài sản của thiết bị, ví dụ LT-204. Không truyền mã nhân viên dạng EMP-xxxx. Nếu chỉ biết employee_id, dùng lookup_user để lấy assigned_assets trước; không suy đoán mã thiết bị. CẤM điền các từ chung chung như 'laptop', 'pc'."}
        check: {type: string, enum: [all, network, vpn, security, hardware, software], default: "all", description: "  Phạm vi chẩn đoán. Luôn truyền rõ giá trị phù hợp với ngữ cảnh. Khi vấn đề là VPN hoặc certificate VPN, dùng vpn kể cả khi người dùng nói chung. Chỉ dùng all cho yêu cầu kiểm tra tổng thể hoặc không xác định nhóm vấn đề."}
      required: [asset_id]

  - name: lookup_user
    description: "Tra cứu thông tin nhân viên theo mã định danh EMP-xxx. Nếu người dùng chỉ nhắc đến tên phòng ban (như 'Sales', 'IT') hoặc không có mã nhân viên, KHÔNG ĐƯỢC gọi tool này mà PHẢI gọi 'clarify'.Kết quả bao gồm thông tin tài khoản và danh sách mã thiết bị được cấp trong assigned_assets. Nếu người dùng chỉ hỏi tài khoản và thiết bị được cấp, chỉ cần gọi tool này.  Chỉ gọi thêm inspect_device khi người dùng yêu cầu kiểm tra hoặc chẩn đoán thiết bị; khi đó dùng mã tài sản thực tế, không dùng employee_id."
    parameters:
      type: object
      properties:
        employee_id: {type: string, description: "Mã nhân viên (ví dụ: EMP-1003). CẤM điền tên phòng ban như 'Sales'."}
      required: [employee_id]


  - name: format_incident_report
    description: "Trình bày các kết quả đã có thành báo cáo."
    parameters:
      type: object
      properties:
        findings:
          type: array
          default: []
          description: "Các kết quả đã thu thập"
          items:
            type: object
            properties:
              label: {type: string}
              detail: {type: string}
              source: {type: string}
              status: {type: string}
        template: {type: string, enum: [brief, technical, handoff], default: "brief", description: "Mẫu báo cáo"}
        incident_title: {type: string, default: "IT incident", description: "Tiêu đề"}
      required: [findings, template]

  # ---------------- Optional/advanced tools ----------------
  - name: search_device_info
    description: "Tìm thông tin công khai về một model thiết bị trên web. Chỉ truyền hãng, model và loại thông tin; không truyền asset ID, employee ID hoặc dữ liệu nội bộ."
    parameters:
      type: object
      properties:
        manufacturer: {type: string, description: "Hãng sản xuất công khai, ví dụ Lenovo"}
        model: {type: string, description: "Tên model công khai, ví dụ ThinkPad T14 Gen 4"}
        query_type: {type: string, enum: [specs, drivers, support, compatibility], default: "support", description: "Loại thông tin cần tìm"}
        max_results: {type: integer, default: 3, description: "Số kết quả, tối đa 5"}
      required: [manufacturer, model, query_type]

  - name: policy
    description: "Tìm trong chính sách IT nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm"}
        policy_area: {type: string, enum: [all, access_control, data_privacy, external_tools, incident_response, service_operations, ticketing], default: "all", description: "Nhóm chính sách"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: create_ticket
    description: >
      Tạo một ticket hỗ trợ. QUAN TRỌNG: Chỉ gọi tool này sau khi đã gọi
      clarify(response_type="yes_no") và người dùng trả lời xác nhận đồng ý.
      KHÔNG được tự đặt confirmed=true dựa trên nội dung yêu cầu ban đầu.
      Nếu người dùng chưa xác nhận, hãy gọi clarify trước.
      ĐẶC BIỆT: Nếu user thay đổi bất kỳ thông tin nào (summary, priority,
      asset_id) sau khi đã xác nhận, xác nhận cũ bị hủy — phải gọi clarify
      lại với response_type="yes_no" cho payload mới trước khi tạo ticket.
    parameters:
      type: object
      properties:
        summary: {type: string, default: "", description: "Tóm tắt sự cố"}
        priority: {type: string, enum: [low, medium, high, critical], default: "medium", description: "Mức ưu tiên"}
        asset_id: {type: string, default: "", description: "Mã tài sản nếu có"}
        confirmed: {type: boolean, default: false, description: "Chỉ đặt true sau khi người dùng đã xác nhận qua clarify"}
      required: [summary]
